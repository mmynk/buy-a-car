<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buying a car — Bellevue, WA — Sep 2026</title>
<meta name="description" content="A research report for a single car-buying decision. Bellevue, WA, September 2026.">
<meta name="color-scheme" content="light dark">
<style>
/* ============================================================================
   TOKENS — dataviz reference palette, validated in both modes.
   Categorical slots 1–6 pass every hard gate on the adjacent pairlist:
   worst adjacent CVD dE 9.1 light / 8.4 dark; normal-vision 19.6 / 19.3.
   Three light slots sit below 3:1 contrast, so the relief rule applies:
   every chart ships visible labels AND a table view.
   ========================================================================== */
:root{
  --blab-w:10rem; --bval-w:4.75rem;
  color-scheme: light;
  --plane:#f9f9f7; --surface:#fcfcfb; --surface-2:#f4f3ef;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --hair:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --seq-250:#86b6ef; --seq-450:#2a78d6; --seq-550:#1c5cab;
  --div-a:#2a78d6; --div-b:#e34948; --div-mid:#f0efec;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-ink:#006300; --warn-ink:#8a5a00;
  --demph:#b9b8b1;
  --radius:10px;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  --tap:44px;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#232322;
    --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --hair:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
    --seq-250:#9ec5f4; --seq-450:#3987e5; --seq-550:#184f95;
    --div-a:#3987e5; --div-b:#e66767; --div-mid:#383835;
    --good-ink:#0ca30c; --warn-ink:#fab219; --demph:#4a4a47;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#232322;
  --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --hair:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  --seq-250:#9ec5f4; --seq-450:#3987e5; --seq-550:#184f95;
  --div-a:#3987e5; --div-b:#e66767; --div-mid:#383835;
  --good-ink:#0ca30c; --warn-ink:#fab219; --demph:#4a4a47;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--plane); color:var(--ink);
  font:16px/1.6 var(--sans);
  overflow-wrap:break-word;
}
h1,h2,h3,h4{line-height:1.2; margin:0 0 .4em; font-weight:640; letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,5vw,2.6rem)}
h2{font-size:clamp(1.35rem,3.6vw,1.9rem)}
h3{font-size:clamp(1.05rem,2.4vw,1.25rem)}
h4{font-size:1rem}
p{margin:0 0 .9em}
a{color:var(--s1)}
ul,ol{margin:0 0 1em; padding-left:1.25em}
li{margin:.35em 0}
small{font-size:.8125rem}
code,.num{font-variant-numeric:tabular-nums}

.skip{position:absolute;left:-9999px;top:0;background:var(--surface);color:var(--ink);padding:.6em 1em;z-index:99}
.skip:focus{left:8px;top:8px;outline:2px solid var(--s1)}
:focus-visible{outline:2px solid var(--s1); outline-offset:2px; border-radius:4px}

/* ---------- layout ---------- */
.wrap{max-width:64rem;margin:0 auto;padding:0 clamp(.9rem,3vw,2rem)}
.sec{padding:clamp(2.2rem,6vw,4rem) 0; border-top:1px solid var(--hair)}
.sec:first-of-type{border-top:0}
.sec>.wrap>header{margin-bottom:1.6rem}
.eyebrow{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 .5em}
.lede{font-size:clamp(1rem,2.3vw,1.15rem);color:var(--ink-2);max-width:60ch}

/* ---------- masthead / nav ---------- */
.masthead{padding:clamp(1.6rem,5vw,3rem) 0 .5rem}
.masthead .meta{color:var(--muted);font-size:.85rem}
nav.sticky{
  position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--plane) 92%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--hair)
}
nav.sticky .row{display:flex;gap:.35rem;align-items:center;overflow-x:auto;scrollbar-width:none;padding:.45rem 0}
nav.sticky .row::-webkit-scrollbar{display:none}
nav.sticky a{
  flex:0 0 auto;text-decoration:none;color:var(--ink-2);font-size:.82rem;font-weight:560;
  padding:.5rem .6rem;border-radius:999px;white-space:nowrap;min-height:36px;display:flex;align-items:center
}
nav.sticky a:hover{background:var(--surface-2);color:var(--ink)}
nav.sticky a[aria-current="true"]{background:var(--ink);color:var(--plane)}
nav.sticky a.hot{color:var(--crit);font-weight:700}
nav.sticky a.hot[aria-current="true"]{background:var(--crit);color:#fff}
.navspace{flex:1 0 .5rem}
.tbtn{flex:0 0 auto;background:none;border:1px solid var(--hair);color:var(--ink-2);border-radius:999px;
  min-height:36px;padding:0 .7rem;font:inherit;font-size:.8rem;cursor:pointer}
.tbtn:hover{background:var(--surface-2);color:var(--ink)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);padding:clamp(.9rem,2.6vw,1.4rem);margin:0 0 1rem}
.card>h3:first-child,.card>h4:first-child{margin-top:0}
.grid{display:grid;gap:1rem}
@media(min-width:46rem){
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
}

/* ---------- status chips ---------- */
.chip{display:inline-flex;align-items:center;gap:.35em;font-size:.7rem;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;padding:.18em .5em;border-radius:5px;border:1px solid var(--hair);
  background:var(--surface-2);color:var(--ink-2);white-space:nowrap;vertical-align:.08em}
.chip .gl{font-size:.85em;line-height:1}
.chip.verified{color:var(--good-ink);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.chip.unverified{color:var(--warn-ink);border-color:color-mix(in srgb,var(--warn) 60%,transparent);background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
.chip.pending{color:var(--crit);border-style:dashed;border-color:color-mix(in srgb,var(--crit) 50%,transparent);
  background:repeating-linear-gradient(45deg,transparent,transparent 4px,color-mix(in srgb,var(--crit) 10%,transparent) 4px,color-mix(in srgb,var(--crit) 10%,transparent) 8px)}
.chip.soft{color:var(--warn-ink);border-color:color-mix(in srgb,var(--warn) 60%,transparent)}
.chip.tiny{font-size:.62rem;padding:.1em .38em}

/* ---------- pending placeholder ---------- */
.pending-box{
  border:1.5px dashed color-mix(in srgb,var(--crit) 55%,transparent);border-radius:8px;padding:.7rem .8rem;
  background:repeating-linear-gradient(45deg,transparent,transparent 6px,color-mix(in srgb,var(--crit) 7%,transparent) 6px,color-mix(in srgb,var(--crit) 7%,transparent) 12px);
  font-size:.88rem;color:var(--ink-2)
}
.pending-box .k{font-family:var(--mono);font-size:.8em;background:var(--surface-2);padding:.1em .35em;border-radius:4px;color:var(--ink);word-break:break-all}
.pending-box b{color:var(--crit)}

/* ---------- callouts ---------- */
.callout{border-left:3px solid var(--axis);padding:.7rem 0 .7rem .9rem;margin:0 0 1rem;font-size:.94rem;color:var(--ink-2)}
.callout>*:last-child{margin-bottom:0}
.callout.caveat{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 7%,transparent);padding-right:.9rem;border-radius:0 8px 8px 0}
.callout.bad{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 6%,transparent);padding-right:.9rem;border-radius:0 8px 8px 0}
.callout.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 7%,transparent);padding-right:.9rem;border-radius:0 8px 8px 0}
.callout .lbl{display:block;font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink);margin-bottom:.3em}

/* ---------- source citation ---------- */
details.cite{display:inline-block;font-size:.75rem;vertical-align:.06em}
details.cite>summary{cursor:pointer;color:var(--muted);list-style:none;display:inline-flex;align-items:center;gap:.25em;
  border-bottom:1px dotted var(--axis);min-height:22px}
details.cite>summary::-webkit-details-marker{display:none}
details.cite>summary:hover{color:var(--ink)}
details.cite[open]>summary{color:var(--ink)}
details.cite .body{display:block;background:var(--surface-2);border:1px solid var(--hair);border-radius:8px;
  padding:.6rem .7rem;margin-top:.4rem;font-size:.78rem;line-height:1.5;color:var(--ink-2);max-width:46rem}
details.cite .body dl{margin:0}
details.cite .body dt{font-weight:650;color:var(--ink);margin-top:.5em}
details.cite .body dt:first-child{margin-top:0}
details.cite .body dd{margin:.1em 0 0}
details.cite .body .cav{color:#8a5a00;margin-top:.25em}
details.cite .body a{word-break:break-all}

/* ---------- tables ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 .6rem}
table{border-collapse:collapse;width:100%;font-size:.86rem}
caption{text-align:left;font-size:.8rem;color:var(--muted);padding-bottom:.5em}
th,td{text-align:left;padding:.45rem .6rem;border-bottom:1px solid var(--hair);vertical-align:top}
th{font-weight:650;font-size:.76rem;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:hover{background:var(--surface-2)}
tr.hl td{background:color-mix(in srgb,var(--s1) 7%,transparent)}
tr.hl td:first-child{box-shadow:inset 3px 0 0 var(--s1)}
tr.dim td{color:var(--muted)}
.nodata{color:var(--crit);font-weight:650;font-size:.78rem;letter-spacing:.03em}

/* ---------- stat tiles ---------- */
.tiles{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr))}
.tile{background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);padding:.9rem}
.tile .lab{font-size:.78rem;color:var(--muted);margin:0 0 .3em}
.tile .val{font-size:clamp(1.5rem,4.4vw,2rem);font-weight:660;line-height:1.05;letter-spacing:-.02em}
.tile .sub{font-size:.8rem;color:var(--ink-2);margin-top:.35em}
.tile .dl{font-size:.8rem;font-weight:650;margin-top:.25em}
.tile .dl.bad{color:var(--crit)} .tile .dl.good{color:var(--good-ink)}
.hero-fig{font-size:clamp(2.6rem,10vw,4.4rem);font-weight:680;line-height:1;letter-spacing:-.03em;margin:0}

/* ---------- charts ---------- */
.chart{margin:0 0 .4rem}
.chart .ctitle{font-weight:650;font-size:.98rem;margin:0 0 .15em}
.chart .csub{font-size:.8rem;color:var(--muted);margin:0 0 .8rem}
.legend{display:flex;flex-wrap:wrap;gap:.5rem 1rem;margin:0 0 .8rem;font-size:.78rem;color:var(--ink-2)}
.legend .it{display:inline-flex;align-items:center;gap:.4em}
.key{width:12px;height:12px;border-radius:3px;flex:0 0 auto;display:inline-block}
.key.line{height:3px;width:16px;border-radius:2px}
.key.none{background:none!important;border:1.5px dashed color-mix(in srgb,var(--crit) 55%,transparent)}
.key.band{background:repeating-linear-gradient(45deg,transparent 0 3px,var(--demph) 3px 6px)!important;border:1.5px dashed var(--axis)}
.plot{position:relative}
.brow{display:grid;grid-template-columns:var(--blab-w) 1fr;gap:.5rem .7rem;align-items:center;padding:.22rem 0}
@media(max-width:56rem){:root{--blab-w:8rem}}
@media(max-width:34rem){.brow{grid-template-columns:1fr;gap:.1rem;padding:.35rem 0}}
.blab{font-size:.82rem;color:var(--ink-2);line-height:1.25}
.blab .tag{display:block;margin-top:.15em}
.blab .tag .chip{white-space:normal;font-size:.6rem;line-height:1.3}
.btrack{position:relative;min-height:20px;display:flex;align-items:center;gap:.5rem}
/* The bar lives in its own flex-sizing wrapper so a percentage-width bar plus a
   nowrap value label can never sum past the row. */
.bwrap{flex:1 1 auto;min-width:0;display:flex;align-items:center;min-height:20px;
  background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px);
  background-size:25% 100%;background-position:0 0}
.bar{height:16px;border-radius:0 4px 4px 0;background:var(--seq-450);min-width:2px;flex:0 0 auto;
  transition:filter .12s ease}
.bar:hover,.bar:focus-visible{filter:brightness(1.08)}
.bar.demph{background:var(--demph)}
.bar.s1{background:var(--s1)} .bar.s2{background:var(--s2)}
.bar.hatch{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 3px,transparent 3px 6px)}
.bar.noval{background:transparent;border:1.5px dashed color-mix(in srgb,var(--crit) 55%,transparent);height:16px;
  background-image:repeating-linear-gradient(45deg,transparent 0 5px,color-mix(in srgb,var(--crit) 12%,transparent) 5px 10px)}
.bval{font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;white-space:nowrap;
  flex:0 0 auto;width:var(--bval-w);text-align:right}
.bval.mut{color:var(--muted);font-weight:500}
.axis{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);
  border-top:1px solid var(--axis);margin-top:.5rem;padding-top:.25rem;font-variant-numeric:tabular-nums}
.axis.offset{margin-left:calc(var(--blab-w) + .7rem);margin-right:calc(var(--bval-w) + .5rem)}
@media(max-width:34rem){.axis.offset{margin-left:0}}

/* dumbbell */
.dbrow{display:grid;grid-template-columns:minmax(5rem,7rem) 1fr;gap:.6rem;align-items:center;padding:.3rem 0}
@media(max-width:34rem){.dbrow{grid-template-columns:1fr;gap:.15rem}}
/* Right margin reserves room for the end label and for the half of a 100% dot
   that sits past the track edge. */
.dbtrack{position:relative;height:26px;margin-right:5rem;
  background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px);background-size:25% 100%}
.dbline{position:absolute;top:12px;height:2px;background:var(--axis)}
.dot{position:absolute;top:5px;width:16px;height:16px;border-radius:50%;margin-left:-8px;
  box-shadow:0 0 0 2px var(--surface)}
.dot.a{background:var(--seq-250)} .dot.b{background:var(--seq-550)}
.dblabel{position:absolute;top:2px;font-size:.74rem;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}

/* diverging */
.dvrow{display:grid;grid-template-columns:1fr;gap:.15rem;padding:.4rem 0;border-bottom:1px solid var(--hair)}
.dvrow:last-child{border-bottom:0}
.dvlab{font-size:.84rem;color:var(--ink-2)}
/* Symmetric margins reserve room for the value label on whichever side the bar grows. */
.dvtrack{position:relative;height:22px;display:flex;align-items:center;margin:0 5rem}
@media(max-width:34rem){.dvtrack{margin:0 3.6rem}}
.dvmid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--axis)}
.dvbar{position:absolute;height:16px;background:var(--div-a)}
.dvbar.left{background:var(--div-b);border-radius:4px 0 0 4px}
.dvbar.right{border-radius:0 4px 4px 0}
.dvbar.unc{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.5) 0 3px,transparent 3px 6px)}
.dvval{position:absolute;font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}

/* columns */
.cols{display:flex;align-items:flex-end;gap:2px;height:130px;
  background-image:linear-gradient(to top,var(--grid) 1px,transparent 1px);background-size:100% 25%}
.col{flex:1 1 0;background:var(--seq-450);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.col:hover,.col:focus-visible{filter:brightness(1.08)}
.colx{display:flex;gap:2px;border-top:1px solid var(--axis);padding-top:.25rem}
.colx span{flex:1 1 0;text-align:center;font-size:.62rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* stacked */
.stack{display:flex;width:100%;flex:1 1 auto;min-width:0;height:18px;border-radius:0 4px 4px 0;overflow:visible;gap:0}
.seg{height:18px;flex:0 0 auto;min-width:1px;box-shadow:inset -1px 0 0 var(--bg)}
.seg:last-of-type{border-radius:0 4px 4px 0}
.seg.band{border:1.5px dashed var(--axis);background:repeating-linear-gradient(45deg,transparent 0 4px,var(--demph) 4px 8px);opacity:.85}

/* table view toggle */
details.tv{margin-top:.5rem;font-size:.8rem}
details.tv>summary{cursor:pointer;color:var(--muted);min-height:32px;display:inline-flex;align-items:center;gap:.3em}
details.tv>summary:hover{color:var(--ink)}

/* tooltip */
#tip{position:fixed;z-index:80;pointer-events:none;opacity:0;transform:translateY(-4px);
  background:var(--surface);color:var(--ink);border:1px solid var(--hair);border-radius:8px;
  box-shadow:0 6px 24px rgba(0,0,0,.18);padding:.5rem .6rem;font-size:.78rem;max-width:20rem;line-height:1.45;
  transition:opacity .1s ease}
#tip[data-on]{opacity:1;transform:none}
#tip .tv1{font-weight:680;font-size:.95rem;font-variant-numeric:tabular-nums}
#tip .tl{color:var(--ink-2)}
#tip .tn{color:var(--muted);margin-top:.3em;font-size:.72rem}

/* ---------- controls ---------- */
.ctrls{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr));margin:0 0 1.2rem}
.ctrl label{display:block;font-size:.8rem;font-weight:600;color:var(--ink-2);margin-bottom:.3em}
.ctrl .hint{font-size:.72rem;color:var(--muted);font-weight:400}
input[type=range]{width:100%;accent-color:var(--s1);min-height:var(--tap)}
input[type=number],input[type=text],select,textarea{
  width:100%;font:inherit;font-size:.9rem;padding:.5rem .6rem;min-height:var(--tap);
  background:var(--surface);color:var(--ink);border:1px solid var(--axis);border-radius:8px}
textarea{min-height:3.4rem;resize:vertical}
.wval{float:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700}
.btn{font:inherit;font-size:.85rem;font-weight:600;padding:.55rem .9rem;min-height:var(--tap);
  background:var(--surface);color:var(--ink);border:1px solid var(--axis);border-radius:8px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);color:var(--plane);border-color:var(--ink)}
.btnrow{display:flex;flex-wrap:wrap;gap:.5rem}

/* ---------- countdown ---------- */
.cd{display:flex;gap:.6rem;flex-wrap:wrap;margin:.6rem 0}
.cd div{background:var(--surface-2);border:1px solid var(--hair);border-radius:8px;padding:.5rem .7rem;text-align:center;min-width:4.2rem}
.cd b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.1}
.cd span{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* ---------- test drive ---------- */
.today{background:var(--crit);color:#fff;border-radius:var(--radius);padding:.8rem 1rem;margin:0 0 1.2rem}
.today b{font-size:1.05rem}
.chk{display:flex;gap:.7rem;align-items:flex-start;padding:.55rem .6rem;border-radius:8px;
  min-height:var(--tap);cursor:pointer;border:1px solid transparent}
.chk:hover{background:var(--surface-2)}
.chk input{width:26px;height:26px;flex:0 0 auto;margin:0;accent-color:var(--good)}
.chk span{font-size:.94rem;line-height:1.45;padding-top:.15em}
.chk input:checked+span{color:var(--muted);text-decoration:line-through}
.chk.filter input:checked+span{color:var(--ink);text-decoration:none;font-weight:600}
.chkgroup{border:1px solid var(--hair);border-radius:var(--radius);background:var(--surface);margin:0 0 .8rem;overflow:hidden}
.chkgroup>summary{cursor:pointer;padding:.85rem 1rem;font-weight:650;min-height:var(--tap);
  display:flex;align-items:center;justify-content:space-between;gap:.6rem;list-style:none}
.chkgroup>summary::-webkit-details-marker{display:none}
.chkgroup>summary::after{content:"+";font-size:1.2rem;color:var(--muted);font-weight:400}
.chkgroup[open]>summary::after{content:"–"}
.chkgroup>summary:hover{background:var(--surface-2)}
.chkgroup .inner{padding:.2rem .5rem .7rem}
.prog{font-size:.72rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;
  background:var(--surface-2);border-radius:999px;padding:.15em .55em;white-space:nowrap}
.prog.done{color:var(--good-ink)}
.cartabs{display:flex;gap:.4rem;overflow-x:auto;padding:.2rem 0 .6rem;scrollbar-width:none}

.seg5 label{flex:1 1 0;position:relative}
.seg5 input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg5 span{display:flex;align-items:center;justify-content:center;min-height:var(--tap);

  background:var(--surface);color:var(--ink-2)}

.seg5 input:focus-visible+span{outline:2px solid var(--s1);outline-offset:2px}
.notefield{margin-top:.5rem}
.notefield summary{font-size:.78rem;color:var(--muted);cursor:pointer;min-height:32px;display:flex;align-items:center}
.saved{font-size:.75rem;color:var(--good-ink);font-weight:600}

.ranked{list-style:none;padding:0;margin:0}
.ranked li{display:grid;grid-template-columns:2rem 1fr;gap:.7rem;padding:.8rem 0;border-bottom:1px solid var(--hair);align-items:start}
.ranked li:last-child{border-bottom:0}
.ranked .r{font-size:1.15rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.ranked .nm{font-weight:650}
.ranked .rs{font-size:.88rem;color:var(--ink-2);margin-top:.2em}
.out{border:1px solid var(--hair);border-radius:var(--radius);background:var(--surface);margin:0 0 .8rem;overflow:hidden}
.out>summary{cursor:pointer;padding:.85rem 1rem;min-height:var(--tap);display:flex;align-items:center;

.out>summary::-webkit-details-marker{display:none}
.out>summary:hover{background:var(--surface-2)}
.out .nm{font-weight:650}
.out .wh{font-size:.85rem;color:var(--ink-2);flex:1 1 14rem}
.out .inner{padding:0 1rem 1rem;border-top:1px solid var(--hair);padding-top:.9rem}
.two{display:grid;gap:1rem}
@media(min-width:46rem){.two{grid-template-columns:1fr 1fr}}
.reasons{margin:0;padding-left:1.15em;font-size:.9rem}
.reasons li{margin:.45em 0}

.numline.total{border-top:2px solid var(--ink);border-bottom:0;margin-top:.3rem;padding-top:.6rem;font-weight:700;font-size:1rem}

<script>
(function(){
"use strict";
var D = window.DATA;
if(!D){ document.getElementById('main').textContent = 'data.js did not load.'; return; }

/* ========================================================================
   DOM helpers. All data text goes in via textContent — never innerHTML.
   ====================================================================== */
function el(tag, attrs, kids){
  var n = document.createElement(tag);
  /* Second argument may be children instead of attributes: an array, a string,
     a number, or a node. Anything else is treated as the attribute map. */
  if(Array.isArray(attrs) || typeof attrs==='string' || typeof attrs==='number' ||
     (attrs && attrs.nodeType)){ kids = attrs; attrs = null; }
  if(attrs) for(var k in attrs){
    var v = attrs[k];
    if(v===null||v===undefined||v===false) continue;
    if(k==='class') n.className = v;
    else if(k==='text') n.textContent = v;
    else if(k==='dataset'){ for(var d in v){ if(v[d]!=null) n.dataset[d]=v[d]; } }
    else n.setAttribute(k, v===true ? '' : v);
  }
  add(n, kids);
  return n;
}
function add(n, kids){
  if(kids===null||kids===undefined||kids===false) return n;
  if(Array.isArray(kids)){ kids.forEach(function(k){ add(n,k); }); return n; }
  if(typeof kids==='string'||typeof kids==='number') n.appendChild(document.createTextNode(String(kids)));
  else n.appendChild(kids);
  return n;
}
function frag(kids){ var f = document.createDocumentFragment(); add(f, kids); return f; }
function mount(id, kids){ var host = document.getElementById(id); host.appendChild(frag(kids)); }

/* ========================================================================
   Formatters
   ====================================================================== */
function usd(n, opts){
  if(n===null||n===undefined) return '—';
  var o = opts||{};
  return '$' + Number(n).toLocaleString('en-US',{minimumFractionDigits:o.cents?2:0, maximumFractionDigits:o.cents?2:0});
}
function pct(n, dp){ if(n===null||n===undefined) return '—';
  return Number(n).toLocaleString('en-US',{minimumFractionDigits:dp===undefined?1:dp, maximumFractionDigits:dp===undefined?1:dp}) + '%'; }
function fmtDate(iso){
  if(!iso) return '';
  var p = String(iso).slice(0,10).split('-');
  var m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  if(p.length<3) return iso;
  return Number(p[2]) + ' ' + m[Number(p[1])-1] + ' ' + p[0];
}
function carName(id){ return (D.cars[id] && D.cars[id].name) || id; }

/* ========================================================================
   Status chips + citations
   ====================================================================== */
var GLYPH = { verified:'✓', pending:'–', unverified:'⚠', soft:'⚠' };
var CHIPTEXT = { verified:'Verified', pending:'Not yet researched', unverified:'Unconfirmed', soft:'Soft figure' };
function chip(status, textOverride, tiny){
  var s = status||'unverified';
  return el('span',{class:'chip '+s+(tiny?' tiny':''), title:CHIPTEXT[s]||s},[
    el('span',{class:'gl','aria-hidden':'true',text:GLYPH[s]||''}),
    el('span',{text: textOverride || CHIPTEXT[s] || s})
  ]);
}
function srcIds(s){ if(!s) return []; return Array.isArray(s)?s:[s]; }

/* A citation: <details> so it works with no JS, prints open, and is keyboard reachable. */
function cite(srcRef, date, note){
  var ids = srcIds(srcRef).filter(function(i){ return D.sources[i]; });
  if(!ids.length && !note) return null;
  var label = ids.length ? (D.sources[ids[0]].publisher + (ids.length>1 ? ' +'+(ids.length-1) : '')) : 'caveat';
  var dl = el('dl');
  ids.forEach(function(i){
    var s = D.sources[i];
    add(dl, el('dt',{text:s.publisher}));
    var dd = el('dd',[ s.title, ' · ', fmtDate(date && ids.length===1 ? date : s.date) ]);
    if(s.url) add(dd, [' · ', el('a',{href:s.url, rel:'noreferrer noopener', target:'_blank', text:'link'})]);
    add(dl, dd);
    if(s.note) add(dl, el('dd',{class:'cav', text:'Caveat: '+s.note}));
  });
  if(note) add(dl, el('dd',{class:'cav', text:'Caveat: '+note}));
  return el('details',{class:'cite'},[
    el('summary',[ el('span',{'aria-hidden':'true',text:'ⓘ'}), 'source: '+label ]),
    el('span',{class:'body'}, dl)
  ]);
}
/* A pending placeholder that cannot be mistaken for data. */
function pendingBox(need, key){
  return el('div',{class:'pending-box'},[
    el('b',{text:'Not yet researched. '}),
    need ? need+'. ' : '',
    key ? frag(['Fill ', el('span',{class:'k',text:key}), ' in data.js.']) : ''
  ]);
}
/* ========================================================================
   Tooltip (shared). Works on hover AND keyboard focus.
   ====================================================================== */
var tip = document.getElementById('tip');
function showTip(e){
  var t = e.target.closest ? e.target.closest('[data-tv]') : null;
  if(!t) return;
  tip.textContent='';
  add(tip,[
    el('div',{class:'tv1',text:t.dataset.tv}),
    t.dataset.tl ? el('div',{class:'tl',text:t.dataset.tl}) : null,
    t.dataset.tn ? el('div',{class:'tn',text:t.dataset.tn}) : null
  ]);
  tip.setAttribute('data-on','');
  place(t, e);
}
function place(t, e){
  var r = t.getBoundingClientRect();
  var x = (e && e.clientX!=null && e.type!=='focusin') ? e.clientX : r.left + r.width/2;
  var y = r.top;
  var tw = tip.offsetWidth, th = tip.offsetHeight;
  var L = Math.min(Math.max(8, x - tw/2), window.innerWidth - tw - 8);
  var T = y - th - 10; if(T < 8) T = r.bottom + 10;
  tip.style.left = L+'px'; tip.style.top = T+'px';
}
function hideTip(){ tip.removeAttribute('data-on'); }
document.addEventListener('pointerover', showTip);
document.addEventListener('pointermove', function(e){
  var t = e.target.closest ? e.target.closest('[data-tv]') : null;
  if(t && tip.hasAttribute('data-on')) place(t,e);
});
document.addEventListener('pointerout', function(e){ if(e.target.closest && e.target.closest('[data-tv]')) hideTip(); });
document.addEventListener('focusin', showTip);
document.addEventListener('focusout', hideTip);
document.addEventListener('scroll', hideTip, {passive:true});

/* ========================================================================
   Chart primitives — plain HTML/CSS marks. Every chart ships a table view.
   ====================================================================== */
/* Axis scale: pick a round STEP, then as many whole steps as it takes to cover the
   data (4 to 6 of them). That gives round tick labels and still uses the width. */
function niceScale(v){
  if(!(v>0)) return {max:1, ticks:[0,1]};
  var e = Math.floor(Math.log10(v)) - 2, best = null;
  for(var i=e;i<=e+4;i++){
    var mag = Math.pow(10,i);
    [1,2,2.5,5].forEach(function(u){
      var step = u*mag, n = Math.ceil(v/step);
      if(n>=4 && n<=6 && (!best || step*n < best.max)) best = {step:step, n:n, max:step*n};
    });
  }
  if(!best){ var s = v/4; best = {step:s, n:4, max:v}; }
  var ticks = [];
  for(var k=0;k<=best.n;k++){ ticks.push(best.step*k); }
  return {max:best.max, ticks:ticks};
}

/* Gridlines must land on the tick positions, so their spacing follows the tick count. */
function gridStyle(intervals){ return 'background-size:' + (100/intervals) + '% 100%'; }

function chartFrame(spec, plot, tableFn){
  var box = el('figure',{class:'chart', style:'margin:0'});
  add(box, el('figcaption',[
    el('p',{class:'ctitle',text:spec.title}),
    spec.sub ? el('p',{class:'csub'},[ spec.sub, spec.src ? frag([' ', cite(spec.src, spec.date, spec.note)]) : null ]) : null
  ]));
  if(spec.legend && spec.legend.length){
    add(box, el('div',{class:'legend'}, spec.legend.map(function(l){
      return el('span',{class:'it'},[
        el('span',{class:'key'+(l.line?' line':'')+(l.cls?' '+l.cls:''),
          style: l.color ? 'background:'+l.color : null, 'aria-hidden':'true'}),
        l.label ]);
    })));
  }
  add(box, plot);
  if(tableFn) add(box, el('details',{class:'tv'},[ el('summary',{text:'Table view'}), tableFn() ]));
  return box;
}

/* Horizontal bars. rows: {label, tag, value, display, note, cls, pending, hatch} */
function hbar(spec){
  var rows = spec.rows;
  var scale = niceScale(Math.max.apply(null, rows.map(function(r){ return r.value||0; })));
  var max = scale.max, grid = gridStyle(scale.ticks.length-1);
  var plot = el('div',{class:'plot'});
  rows.forEach(function(r){
    var wrap = el('div',{class:'bwrap', style:grid});
    var track = el('div',{class:'btrack'}, wrap);
    if(r.value===null||r.value===undefined){
      add(wrap, el('div',{class:'bar noval', style:'width:22%', tabindex:'0', role:'img',
        'aria-label': r.label+': no data', dataset:{tv:'No data', tl:r.label, tn:r.note||''}}));
      add(track, el('span',{class:'bval mut',text: r.display || 'NO DATA'}));
    } else {
      var w = Math.max(0.6, (r.value/max)*100);
      add(wrap, el('div',{class:'bar '+(r.cls||'')+(r.hatch?' hatch':''), style:'width:'+w+'%', tabindex:'0', role:'img',
        'aria-label': r.label+': '+(r.display||r.value),
        dataset:{tv:(r.display||String(r.value)), tl:r.label, tn:r.note||''}}));
      add(track, el('span',{class:'bval',text: r.display || String(r.value)}));
    }
    add(plot, el('div',{class:'brow'},[
      el('div',{class:'blab'},[ r.label, r.tag ? el('span',{class:'tag'}, chip(r.tagStatus||'unverified', r.tag, true)) : null ]),
      track
    ]));
  });
  if(spec.axis!==false){
    add(plot, el('div',{class:'axis offset'}, scale.ticks.map(function(v){
      return el('span',{text: spec.fmt ? spec.fmt(v) : String(Math.round(v))});
    })));
  }
  return chartFrame(spec, plot, function(){
    var tb = el('tbody');
    rows.forEach(function(r){
      add(tb, el('tr',[ el('th',{scope:'row',text:r.label}),
        el('td',{class:'n'}, r.value===null||r.value===undefined ? el('span',{class:'nodata',text:r.display||'NO DATA'}) : (r.display||String(r.value))),
        el('td',{text: r.note || (r.tag||'')}) ]));
    });
    return el('div',{class:'tw'}, el('table',[
      el('thead', el('tr',[ el('th',{text:'Item'}), el('th',{class:'n',text:spec.valueHead||'Value'}), el('th',{text:'Note'}) ])), tb ]));
  });
}

/* Dumbbell. rows: {label, a, b, hl} */
function dumbbell(spec){
  var rows = spec.rows;
  var scale = niceScale(Math.max.apply(null, rows.map(function(r){ return Math.max(r.a,r.b); })));
  var max = scale.max;
  var plot = el('div',{class:'plot'});
  rows.forEach(function(r){
    var pa = (r.a/max)*100, pb = (r.b/max)*100;
    var lo = Math.min(pa,pb), hi = Math.max(pa,pb);
    var track = el('div',{class:'dbtrack', style:gridStyle(scale.ticks.length-1)},[
      el('div',{class:'dbline', style:'left:'+lo+'%;width:'+(hi-lo)+'%'}),
      el('div',{class:'dot a', style:'left:'+pa+'%', tabindex:'0', role:'img',
        'aria-label':r.label+', '+spec.aLabel+': '+usd(r.a),
        dataset:{tv:usd(r.a), tl:r.label+' · '+spec.aLabel, tn:spec.bLabel+': '+usd(r.b)}}),
      el('div',{class:'dot b', style:'left:'+pb+'%', tabindex:'0', role:'img',
        'aria-label':r.label+', '+spec.bLabel+': '+usd(r.b),
        dataset:{tv:usd(r.b), tl:r.label+' · '+spec.bLabel, tn:spec.aLabel+': '+usd(r.a)}}),
      r.hl ? el('div',{class:'dblabel', style:'left:calc('+hi+'% + 12px)', text:usd(r.b)}) : null
    ]);
    add(plot, el('div',{class:'dbrow'},[ el('div',{class:'blab',text:r.label}), track ]));
  });
  add(plot, el('div',{class:'axis offset'}, scale.ticks.map(function(v){ return el('span',{text:usd(v)}); })));
  return chartFrame(spec, plot, function(){
    var tb = el('tbody');
    rows.forEach(function(r){
      add(tb, el('tr',{class:r.hl?'hl':''},[ el('th',{scope:'row',text:r.label}),
        el('td',{class:'n',text:usd(r.a)}), el('td',{class:'n',text:usd(r.b)}), el('td',{class:'n',text:usd(r.a+r.b)}) ]));
    });
    return el('div',{class:'tw'}, el('table',[
      el('thead', el('tr',[ el('th',{text:'Brand'}), el('th',{class:'n',text:spec.aLabel}),
        el('th',{class:'n',text:spec.bLabel}), el('th',{class:'n',text:'Total'}) ])), tb ]));
  });
}

/* Columns over time. rows: {x, value, note} */
function columns(spec){
  var rows = spec.rows, max = niceScale(Math.max.apply(null, rows.map(function(r){ return r.value; }))).max;
  var plot = el('div',{class:'plot'});
  add(plot, el('div',{class:'cols'}, rows.map(function(r){
    return el('div',{class:'col', style:'height:'+Math.max(1,(r.value/max)*100)+'%', tabindex:'0', role:'img',
      'aria-label': spec.xLabel+' '+r.x+': '+usd(r.value),
      dataset:{tv:usd(r.value), tl:spec.xLabel+' '+r.x, tn:r.note||''}});
  })));
  add(plot, el('div',{class:'colx'}, rows.map(function(r){ return el('span',{text:String(r.x)}); })));
  return chartFrame(spec, plot, function(){
    var tb = el('tbody');
    rows.forEach(function(r){ add(tb, el('tr',[ el('th',{scope:'row',text:spec.xLabel+' '+r.x}),
      el('td',{class:'n',text:usd(r.value)}), el('td',{text:r.note||''}) ])); });
    return el('div',{class:'tw'}, el('table',[ el('thead', el('tr',[ el('th',{text:spec.xLabel}),
      el('th',{class:'n',text:'Amount'}), el('th',{text:'Note'}) ])), tb ]));
  });
}

/* ========================================================================
   localStorage, with a graceful failure path
   ====================================================================== */
var LS = (function(){
  var ok = true;
  try { window.localStorage.setItem('__t','1'); window.localStorage.removeItem('__t'); } catch(e){ ok = false; }
  return {
    ok: ok,
    get: function(k, dflt){ if(!ok) return dflt; try{ var v = localStorage.getItem(k); return v==null?dflt:JSON.parse(v); }catch(e){ return dflt; } },
    set: function(k, v){ if(!ok) return false; try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
  };
})();

/* ========================================================================

   ====================================================================== */
var SECTIONS = [
  {id:'verdict', label:'Verdict'}, {id:'criteria', label:'Six criteria'}, {id:'money', label:'Money'},

(function nav(){

  });
  add(host, el('span',{class:'navspace'}));
  var stored = LS.get('buyacar.theme', null);
  if(stored) document.documentElement.setAttribute('data-theme', stored);
  var btn = el('button',{class:'tbtn', type:'button', 'aria-live':'polite'});
  function label(){
    var cur = document.documentElement.getAttribute('data-theme');
    btn.textContent = cur==='dark' ? 'Dark' : cur==='light' ? 'Light' : 'Auto';
    btn.setAttribute('aria-label','Colour theme: '+btn.textContent+'. Click to change.');
  }
  btn.addEventListener('click', function(){
    var order = [null,'light','dark'];
    var cur = document.documentElement.getAttribute('data-theme');
    var next = order[(order.indexOf(cur)+1) % order.length];
    if(next) { document.documentElement.setAttribute('data-theme', next); LS.set('buyacar.theme', next); }
    else { document.documentElement.removeAttribute('data-theme'); LS.set('buyacar.theme', null); }
    label();
  });
  label();
  add(host, btn);

  if('IntersectionObserver' in window){
    var links = {}; SECTIONS.forEach(function(s){ links[s.id] = host.querySelector('[data-sec="'+s.id+'"]'); });
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(e.isIntersecting){
          Object.keys(links).forEach(function(k){ links[k].removeAttribute('aria-current'); });
          if(links[e.target.id]) links[e.target.id].setAttribute('aria-current','true');
        }
      });
    }, {rootMargin:'-45% 0px -50% 0px'});
    SECTIONS.forEach(function(s){ var n = document.getElementById(s.id); if(n) io.observe(n); });
  }
})();

(function verdict(){

  function depRow(name){ return dep.filter(function(r){ return r.model.indexOf(name)===0; })[0]; }

  var ins = D.money.insurance.wa;
  add(tiles, [
    el('div',{class:'tile'},[
      el('p',{class:'lab',text:'Five-year depreciation, Tesla Model Y'}),

/* ========================================================================
   SECTION 2 — THE SIX CRITERIA, interactive
   ====================================================================== */
(function criteriaSection(){
  var WKEY = 'buyacar.weights.v1';
  var CARS = Object.keys(D.matrix);
  var weights = LS.get(WKEY, null) || (function(){
    var w = {}; D.criteria.forEach(function(c){ w[c.id] = c.defaultWeight; }); return w;
  })();
  var showOut = false;

  var SLOT = ['--s1','--s2','--s3','--s4','--s5','--s6'];
  function slot(i){ return 'var('+SLOT[i % SLOT.length]+')'; }

  function scoreCar(id){
    var m = D.matrix[id], lo = 0, hi = 0, denom = 0, pend = 0, parts = [];
    D.criteria.forEach(function(c, i){
      var w = Number(weights[c.id])||0;
      denom += w*5;
      var cell = m[c.id];
      if(!cell) return;
      if(cell.s===null){
        pend++;
        lo += w*1; hi += w*5;
        parts.push({cid:c.id, label:c.label, w:w, s:null, val:w*1, band:w*4, color:slot(i)});
      } else {
        lo += w*cell.s; hi += w*cell.s;
        parts.push({cid:c.id, label:c.label, w:w, s:cell.s, val:w*cell.s, band:0, color:slot(i)});
      }
    });
    var pl = denom? (lo/denom)*100 : 0, ph = denom? (hi/denom)*100 : 0;
    return {id:id, lo:pl, hi:ph, mid:(pl+ph)/2, pending:pend, parts:parts, denom:denom};
  }

  var resultsHost = el('div',{id:'crit-results'});
  var tableHost = el('div',{id:'crit-table'});

  function render(){
    var rows = CARS.filter(function(id){ return showOut || !D.cars[id].ruledOut; }).map(scoreCar);
    rows.sort(function(a,b){ return b.mid - a.mid; });
    var max = 100;

    resultsHost.textContent = '';
    var plot = el('div',{class:'plot'});
    rows.forEach(function(r){
      var wrap = el('div',{class:'bwrap', style:'background-size:25% 100%'});
      var track = el('div',{class:'btrack'}, wrap);
      var stack = el('div',{class:'stack'});
      r.parts.forEach(function(p){
        if(p.val<=0 && p.s!==null) return;
        var pw = r.denom? (p.val/r.denom)*100 : 0;
        if(pw<=0) return;
        add(stack, el('div',{class:'seg', style:'width:'+pw+'%;background:'+p.color, tabindex:'0', role:'img',
          'aria-label': D.cars[r.id].name+', '+p.label+': contributes '+pw.toFixed(1)+' points',
          dataset:{tv:pw.toFixed(1)+' pts', tl:D.cars[r.id].name+' · '+p.label,
            tn: p.s===null ? 'Score not researched — counted at the bottom of the band' : ('score '+p.s+' × weight '+p.w)}}));
      });
      var bandW = r.hi - r.lo;
      if(bandW > 0.5){
        add(stack, el('div',{class:'seg band', style:'width:'+bandW+'%', tabindex:'0', role:'img',
          'aria-label':'unknown range of '+bandW.toFixed(0)+' points from '+r.pending+' unresearched criteria',
          dataset:{tv:'±'+bandW.toFixed(0)+' pts unknown', tl:D.cars[r.id].name,
            tn:r.pending+' criteria have no data. The score is somewhere in this band.'}}));
      }
      add(wrap, stack);
      add(track, el('span',{class:'bval', text: r.pending ? Math.round(r.lo)+'–'+Math.round(r.hi) : String(Math.round(r.lo)) }));
      add(plot, el('div',{class:'brow'},[
        el('div',{class:'blab'},[ D.cars[r.id].name,
          D.cars[r.id].ruledOut ? el('span',{class:'tag'}, chip('unverified','Ruled out',true)) : null,
          r.pending ? el('span',{class:'tag'}, chip('pending', r.pending+' pending',true)) : null ]),
        track
      ]));
    });
    add(plot, el('div',{class:'axis offset'},[0,25,50,75,100].map(function(v){ return el('span',{text:String(v)}); })));

    add(resultsHost, chartFrame({
      title:'Weighted score, out of 100',
      sub:'Coloured segments are each criterion’s contribution. The hatched extension is the range the unresearched criteria could still move the score by.',
      legend: D.criteria.map(function(c,i){ return {label:c.label, color:slot(i)}; })
        .concat([{label:'Unknown range (pending data)', cls:'band'}])
    }, plot, function(){ return critTable(rows); }));
  }

  function critTable(rows){
    var head = el('tr',[ el('th',{text:'Car'}) ]);
    D.criteria.forEach(function(c){ add(head, el('th',{class:'n',text:c.n+'. '+c.label}) ); });
    add(head, el('th',{class:'n',text:'Score'}));
    var tb = el('tbody');
    rows.forEach(function(r){
      var tr = el('tr',{class:D.cars[r.id].ruledOut?'dim':''},[ el('th',{scope:'row',text:D.cars[r.id].name}) ]);
      D.criteria.forEach(function(c){
        var cell = D.matrix[r.id][c.id];
        add(tr, el('td',{class:'n'}, cell.s===null ? el('span',{class:'nodata',text:'PENDING'}) : String(cell.s)));
      });
      add(tr, el('td',{class:'n',text: r.pending ? Math.round(r.lo)+'–'+Math.round(r.hi) : String(Math.round(r.lo))}));
      add(tb, tr);
    });
    return el('div',{class:'tw'}, el('table',[ el('thead',head), tb ]));
  }

  /* weight sliders */
  var ctrls = el('div',{class:'ctrls'});
  D.criteria.forEach(function(c){
    var out = el('span',{class:'wval',text:String(weights[c.id])});
    var inp = el('input',{type:'range', min:'0', max:'5', step:'1', value:String(weights[c.id]),
      id:'w-'+c.id, 'aria-describedby':'wd-'+c.id});
    inp.addEventListener('input', function(){
      weights[c.id] = Number(inp.value); out.textContent = inp.value;
      LS.set(WKEY, weights); render();
    });
    add(ctrls, el('div',{class:'ctrl'},[
      el('label',{for:'w-'+c.id},[ c.n+'. '+c.label, out ]),
      inp,
      el('span',{class:'hint', id:'wd-'+c.id, text:c.measuredBy})
    ]));
  });

  var toggle = el('label',{class:'chk filter', style:'display:inline-flex'},[
    el('input',{type:'checkbox'}), el('span',{text:'Also show the cars that are already ruled out'})
  ]);
  toggle.querySelector('input').addEventListener('change', function(e){ showOut = e.target.checked; render(); });

  var reset = el('button',{class:'btn', type:'button', text:'Reset weights to the buyer’s stated order'});
  reset.addEventListener('click', function(){
    D.criteria.forEach(function(c){
      weights[c.id] = c.defaultWeight;
      var i = document.getElementById('w-'+c.id);
      if(i) i.value = String(c.defaultWeight);
      var lab = document.querySelector('label[for="w-'+c.id+'"] .wval');
      if(lab) lab.textContent = String(c.defaultWeight);
    });
    LS.set(WKEY, weights); render();
  });

  /* criterion cards with the per-car working */
  var cards = el('div',{class:'grid g2'});
  D.criteria.forEach(function(c, i){
    var body = el('div');
    Object.keys(D.matrix).forEach(function(id){
      if(D.cars[id].ruledOut) return;
      var cell = D.matrix[id][c.id];
      add(body, el('details',{class:'out', style:'margin-bottom:.4rem'},[
        el('summary',[
          el('span',[ el('span',{class:'nm',text:D.cars[id].name}), ' ',
            cell.s===null ? chip('pending','No data',true) : el('strong',{text:cell.s+'/5'}) ])
        ]),
        el('div',{class:'inner'},[
          el('p',{style:'margin-bottom:.4em',text:cell.why}),
          el('p',{class:'mini'},[ chip(cell.st), ' ', cite(cell.src) ])
        ])
      ]));
    });
    add(cards, el('div',{class:'card'},[
      el('p',{class:'eyebrow'},[ el('span',{class:'key', style:'background:'+slot(i)+';margin-right:.4em','aria-hidden':'true'}), 'Criterion '+c.n ]),
      el('h4',{text:c.label}),
      el('p',{style:'font-size:.9rem',text:'“'+c.stated+'”'}),
      el('p',{class:'mini',text:'Measured by: '+c.measuredBy}),
      el('details',{class:'tv'},[ el('summary',{text:'Show every car’s score and reasoning'}), body ])
    ]));
  });

  mount('s-criteria', [
    el('header',[
      el('p',{class:'eyebrow',text:'2 · The six criteria'}),
      el('h2',{text:'Your criteria, and how the cars score'}),
      el('p',{class:'lede',text:'These are the buyer’s own six criteria in the buyer’s own order. Move the sliders to re-weight them and the ranking responds. Nothing is hidden: the formula is printed below, and any criterion with no data is counted as a visible range rather than as a guess.'})
    ]),
    el('div',{class:'card'},[
      el('h4',{text:'The weighting model, in full'}),
      el('p',{style:'font-family:var(--mono);font-size:.85rem;background:var(--surface-2);padding:.6rem .7rem;border-radius:8px',text:D.weighting.formula}),
      el('ul', D.weighting.explanation.map(function(t){ return el('li',{text:t}); })),
      el('p',{class:'mini',text:'Score scale: 1 poor, 2 weak, 3 average, 4 good, 5 best in this shortlist. Scores are relative within this shortlist, not absolute.'})
    ]),
    ctrls,
    el('div',{class:'btnrow', style:'margin-bottom:1rem'},[ reset, toggle ]),
    el('div',{class:'card'}, resultsHost),
    tableHost,
    el('h3',{text:'Criterion by criterion'}),
    cards
  ]);
  render();
})();

/* ========================================================================
   ON-ROAD COST CALCULATOR
   ====================================================================== */
(function calculator(){
  var C = D.calculator, W = D.money.wa;
  var state = {};
  Object.keys(C.inputs).forEach(function(k){ state[k] = C.inputs[k].default; });

  var out = el('div',{id:'calc-out'});

  function ratePending(){ return W.purchaseTax.status==='pending' || W.purchaseTax.totalVehicle==null; }

  function compute(){
    var s = state;
    var base = Number(s.sticker)||0, dest = Number(s.destination)||0, doc = Number(s.docFee)||0;
    var taxable = base + dest + doc;
    var taxRate = W.purchaseTax.totalVehicle;
    var tax = taxRate==null ? null : taxable * taxRate/100;
    var title = s.titleDate==='after' ? W.fees.rows[1].newUsd : W.fees.rows[1].usd;
    var wf = W.tabs.weightFees[s.weightBand==='4001to6000'?1:0].usd;
    var tabs = W.tabs.base + wf;
    var rta1 = base * (W.rta.schedule[0].pct/100) * (W.rta.ratePct/100);
    var otd = tax==null ? null : taxable + tax + title + tabs + rta1;
    var financed = otd==null ? null : Math.max(0, otd - (Number(s.down)||0));
    var n = Number(s.termMonths)||36, r = (Number(s.apr)||0)/100/12;
    var pay = financed==null ? null : (r===0 ? financed/n : financed*r/(1-Math.pow(1+r,-n)));
    var interest = (financed==null||pay==null) ? null : (pay*n - financed);

    var hold = Number(s.holdYears)||1;
    var yearly = [], rtaTotal = 0, surTotal = 0, tabsTotal = 0;
    var sur = W.electrificationSurcharge.rows[ s.powertrain==='phev'?2 : s.powertrain==='hev'?1 : 0 ].usd;
    for(var y=1; y<=hold; y++){
      var sch = W.rta.schedule.filter(function(x){ return x.year===Math.min(y,13); })[0] || W.rta.schedule[W.rta.schedule.length-1];
      var rtaY = base*(sch.pct/100)*(W.rta.ratePct/100);
      var surY = y===1 ? 0 : sur;
      var tabsY = y===1 ? 0 : tabs;
      rtaTotal += rtaY; surTotal += surY; tabsTotal += tabsY;
      yearly.push({y:y, rta:rtaY, sur:surY, tabs:tabsY, total:rtaY+surY+tabsY});
    }
    return {taxable:taxable, taxRate:taxRate, tax:tax, title:title, tabs:tabs, wf:wf, rta1:rta1, otd:otd,
      financed:financed, pay:pay, interest:interest, yearly:yearly, rtaTotal:rtaTotal, surTotal:surTotal,
      tabsTotal:tabsTotal, sur:sur, hold:hold, base:base, uplift: (otd!=null && base>0) ? ((otd/base)-1)*100 : null};
  }

  function render(){
    var c = compute();
    out.textContent = '';

    if(ratePending()){
      add(out, pendingBox('The Bellevue purchase tax rate is not in data.js, so nothing can be computed', 'money.wa.purchaseTax.totalVehicle'));
      return;
    }

    var lines = el('div');
    add(lines, [
      el('div',{class:'numline'},[ el('span',{text:'Sticker price'}), el('span',{class:'v',text:usd(state.sticker)}) ]),
      el('div',{class:'numline'},[ el('span',[ 'Destination charge',
        Number(state.destination)===0 ? el('span',{class:'mini'},[' ', 'not in any source — ask the dealer']) : null ]),
        el('span',{class:'v',text:usd(state.destination)}) ]),
      el('div',{class:'numline'},[ el('span',[ 'Dealer doc fee', el('span',{class:'mini'},[' ', W.fees.rows[0].note]) ]),
        el('span',{class:'v',text:usd(state.docFee)}) ]),
      el('div',{class:'numline'},[ el('span',[ 'Washington purchase tax at '+pct(c.taxRate,2), ' ', chip('unverified','Taxable base assumed',true) ]),
        el('span',{class:'v',text:usd(c.tax)}) ]),
      el('div',{class:'numline'},[ el('span',{text:'Dealer title fee'}), el('span',{class:'v',text:usd(c.title)}) ]),
      el('div',{class:'numline'},[ el('span',{text:'First tabs ('+usd(W.tabs.base)+' base + '+usd(c.wf)+' weight)'}), el('span',{class:'v',text:usd(c.tabs)}) ]),
      el('div',{class:'numline'},[ el('span',{text:'First-year RTA excise tax at '+pct(W.rta.ratePct,1)+' of MSRP'}), el('span',{class:'v',text:usd(c.rta1)}) ]),
      el('div',{class:'numline total'},[ el('span',{text:'On the road'}), el('span',{class:'v',text:usd(c.otd)}) ]),
      el('div',{class:'numline'},[ el('span',{text:'That is an uplift over sticker of'}), el('span',{class:'v',text:pct(c.uplift)}) ])
    ]);

    var fin = el('div');
    add(fin, [
      el('div',{class:'numline'},[ el('span',{text:'Amount financed after '+usd(state.down)+' down'}), el('span',{class:'v',text:usd(c.financed)}) ]),
      el('div',{class:'numline'},[ el('span',{text:'Monthly payment, '+state.termMonths+' months at '+pct(state.apr,2)}), el('span',{class:'v',text:usd(c.pay, {cents:true})}) ]),
      el('div',{class:'numline'},[ el('span',{text:'Total interest over the term'}), el('span',{class:'v',text:usd(c.interest)}) ])
    ]);
    if(Number(state.apr)===0){
      add(fin, el('div',{class:'callout good'},[ el('p',{style:'margin:0',text:'At 0% the payment is exactly the balance divided by the term — Mazda’s $27.78 per $1,000 per month is the same arithmetic. It also makes the federal loan-interest deduction worth nothing, because there is no interest to deduct.'}) ]));
    }

    var yt = el('tbody');
    c.yearly.forEach(function(y){
      add(yt, el('tr',[ el('th',{scope:'row',text:'Year '+y.y}), el('td',{class:'n',text:usd(y.rta)}),
        el('td',{class:'n',text:usd(y.tabs)}), el('td',{class:'n',text:usd(y.sur)}), el('td',{class:'n',text:usd(y.total)}) ]));
    });
    add(yt, el('tr',{class:'hl'},[ el('th',{scope:'row',text:'Over '+c.hold+' years'}), el('td',{class:'n',text:usd(c.rtaTotal)}),
      el('td',{class:'n',text:usd(c.tabsTotal)}), el('td',{class:'n',text:usd(c.surTotal)}),
      el('td',{class:'n',text:usd(c.rtaTotal+c.tabsTotal+c.surTotal)}) ]));

    add(out,[
      el('div',{class:'two'},[
        el('div',[ el('h4',{text:'On-road cost, itemised'}), lines,
          el('p',{class:'mini'},[ 'Every rate above comes from data.js. ', cite(['wa-dor','wa-cost-2026']) ]),
          el('div',{class:'callout caveat'},[ el('p',{style:'margin:0',text:'One assumption is flagged: the tax is computed on sticker plus destination plus doc fee. The exact taxable base is not stated in any source — confirm it with the dealer. The research’s own rule of thumb is about '+pct(W.outTheDoor.upliftPct)+' over sticker, which bundles fees differently, so the two will not match to the dollar.'}) ])
        ]),
        el('div',[ el('h4',{text:'Financing'}), fin,
          el('h4',{style:'margin-top:1.2rem',text:'Recurring Washington costs while you own it'}),
          el('div',{class:'tw'}, el('table',[
            el('thead', el('tr',[ el('th',{scope:'col',text:'Period'}), el('th',{class:'n',text:'RTA excise'}), el('th',{class:'n',text:'Tabs'}),
              el('th',{class:'n',text:'Surcharge'}), el('th',{class:'n',text:'Total'}) ])), yt ])),
          el('p',{class:'mini',text:W.electrificationSurcharge.yearOne+' Year 1 tabs and surcharge are already inside the on-road figure.'})
        ])
      ]),
      el('h4',{text:'What this calculator refuses to compute'}),
      el('div',{class:'grid g2'},[
        pendingBox(C.blocked.insurance.label+' — '+C.blocked.insurance.why, C.blocked.insurance.key),
        pendingBox(C.blocked.service.label+' — '+C.blocked.service.why, C.blocked.service.key)
      ]),
      el('p',{class:'mini',text:'Those two lines are deliberately absent from the totals. An invented insurance premium or service figure would change the answer by thousands of dollars, so the calculator leaves them out and says so.'})
    ]);
  }

  var ctrls = el('div',{class:'ctrls'});
  Object.keys(C.inputs).forEach(function(k){
    var spec = C.inputs[k], id = 'ci-'+k, node;
    if(spec.options && typeof spec.options[0]==='object'){
      node = el('select',{id:id}, spec.options.map(function(o){
        return el('option',{value:o.v, selected:o.v===spec.default?true:null, text:o.label}); }));
    } else if(spec.options){
      node = el('select',{id:id}, spec.options.map(function(o){
        return el('option',{value:String(o), selected:o===spec.default?true:null, text:String(o)+' months'}); }));
    } else {
      node = el('input',{type:'number', id:id, value:String(spec.default),
        min:spec.min!=null?String(spec.min):null, max:spec.max!=null?String(spec.max):null,
        step:spec.step!=null?String(spec.step):null});
    }
    node.addEventListener('input', function(){
      state[k] = (spec.options && typeof spec.options[0]==='object') ? node.value : (isNaN(Number(node.value)) ? node.value : Number(node.value));
      render();
    });
    node.addEventListener('change', function(){
      state[k] = (spec.options && typeof spec.options[0]==='object') ? node.value : (isNaN(Number(node.value)) ? node.value : Number(node.value));
      render();
    });
    add(ctrls, el('div',{class:'ctrl'},[
      el('label',{for:id, text:spec.label}), node,
      spec.note ? el('span',{class:'hint',text:spec.note}) : null
    ]));
  });

  document.getElementById('calc-host').appendChild(el('div',{class:'card'},[
    el('h3',{text:C.title}),
    el('p',{text:C.explain}),
    ctrls, out
  ]));
  render();
})();

(function reliabilitySection(){
  var R = D.reliability;

  function studyChart(st){
    var rows = st.rows.map(function(r){
      var cls = r.brand==='Lexus' ? 's1' : r.brand==='Mazda' ? 's2' : 'demph';
      return {label: (r.rank? r.rank+'. ' : '— ') + r.brand, value:r.score,
        display: String(r.score) + (st.id==='cr' ? '' : ' PP100'),
        cls: cls, hatch: !!r.noRank,
        tag: r.noRank ? 'No rank — not eligible' : (r.delta || null),
        tagStatus: r.noRank ? 'pending' : 'unverified',
        note: r.delta || (r.noRank ? 'Tesla is not rank-eligible in this study. Any rank would be invented.' : '')};
    });

/* ========================================================================
   SECTION 7 — TEST DRIVE. Mobile-first, offline, localStorage-backed.
   ====================================================================== */
(function testDriveSection(){
  var T = D.testDrive;
  var KEY = T.storageKey;
  var store = LS.get(KEY, null) || {checks:{}, scores:{}, notes:{}, car:T.scoreCars[0].id};
  if(!store.checks) store.checks = {};
  if(!store.scores) store.scores = {};
  if(!store.notes) store.notes = {};
  var saveNote = el('span',{class:'saved', id:'td-saved'});
  function save(){
    var ok = LS.set(KEY, store);
    saveNote.textContent = ok ? 'Saved' : 'Could not save — local storage is blocked';
    clearTimeout(save._t); save._t = setTimeout(function(){ saveNote.textContent=''; }, 1600);
    updateProgress();
  }

  var progressNodes = [];
  function updateProgress(){
    progressNodes.forEach(function(p){
      var done = p.ids.filter(function(i){ return store.checks[i]; }).length;
      p.node.textContent = done + '/' + p.ids.length;
      p.node.className = 'prog' + (done===p.ids.length ? ' done' : '');
    });
  }

  /* a checkbox list that persists */
  function checkList(prefix, items, textOf){
    var box = el('div');
    var ids = [];
    items.forEach(function(it, i){
      var id = prefix+'-'+i; ids.push(id);
      var input = el('input',{type:'checkbox', id:'cb-'+id, checked: store.checks[id]?true:null});
      input.addEventListener('change', function(){
        if(input.checked) store.checks[id]=true; else delete store.checks[id];
        save();
      });
      add(box, el('label',{class:'chk', for:'cb-'+id},[ input, el('span',{text: textOf? textOf(it) : it}) ]));
    });
    return {node:box, ids:ids};
  }

  function group(title, listSpec, extra, openByDefault){
    var p = el('span',{class:'prog'});
    progressNodes.push({node:p, ids:listSpec.ids});
    return el('details',{class:'chkgroup', open: openByDefault?true:null},[
      el('summary',[ el('span',{text:title}), p ]),
      el('div',{class:'inner'},[ extra||null, listSpec.node ])
    ]);
  }

  /* ---- priority order ---- */
  var priority = el('div',{class:'card'},[
    el('h4',{text:'Drive them in this order'}),
    el('p',{class:'mini',text:T.priority.note}),
    el('ol',{class:'ranked'}, T.priority.rows.map(function(r){
      return el('li',[ el('div',{class:'r',text:String(r.p)}),
        el('div',[ el('div',[ el('span',{class:'nm',text:r.car}), r.ruledOut? frag([' ', chip('unverified','Already ruled out',true)]) : null ]),
          el('p',{class:'rs',text:r.why}) ]) ]);
    })),
    el('p',{class:'mini'},[ cite(T.priority.src) ])
  ]);

  /* ---- groups ---- */
  var groups = el('div');
  var gRules = checkList('rules', T.rules);
  add(groups, group('Rules for the day', gRules, null, true));

  var gBring = checkList('bring', T.bring, function(b){ return b.item + ' — tests ' + b.tests.toLowerCase(); });
  add(groups, group('Bring these', gBring));

  var gRoute = checkList('route', T.route.must);
  add(groups, group('The route — same loop, every car', gRoute,
    el('div',{class:'callout'},[ el('p',{style:'margin:0'},[ el('strong',{text:T.route.rule}) ]) ]), false));

  T.checks.forEach(function(g, gi){
    var lst = checkList('chk'+gi, g.items);
    add(groups, group(g.group, lst, g.note ? el('p',{class:'mini',text:g.note}) : null));
  });

  T.perCar.forEach(function(c, ci){
    var lst = checkList('car'+ci, c.items);
    add(groups, group(c.car, lst, c.note ? el('div',{class:'callout caveat'},[ el('p',{style:'margin:0',text:c.note}) ]) : null));
  });

  var gQ = checkList('q', T.dealerQuestions);
  add(groups, group('Questions for the dealer — write the answers down', gQ,
    el('div',{class:'callout caveat'},[ el('p',{style:'margin:0',text:T.dealerNote}) ])));

  /* ---- scoring ---- */
  var scoreHost = el('div');
  var tabs = el('div',{class:'cartabs', role:'tablist','aria-label':'Choose a car to score'});
  function renderScores(){
    scoreHost.textContent = '';
    var carId = store.car;
    T.scoreRows.forEach(function(row){
      var name = 'sc-'+carId+'-'+row.id;
      var seg = el('div',{class:'seg5', role:'radiogroup','aria-label':row.label});
      [1,2,3,4,5].forEach(function(v){
        var cur = store.scores[carId] && store.scores[carId][row.id];
        var inp = el('input',{type:'radio', name:name, value:String(v), id:name+'-'+v, checked: cur===v?true:null});
        inp.addEventListener('change', function(){
          if(!store.scores[carId]) store.scores[carId] = {};
          store.scores[carId][row.id] = v; save(); renderCompare();
        });
        add(seg, el('label',{for:name+'-'+v},[ inp, el('span',{text:String(v)}) ]));
      });
      var note = el('textarea',{id:'nt-'+name, placeholder:'Note (optional)'});
      note.value = (store.notes[carId] && store.notes[carId][row.id]) || '';
      note.addEventListener('input', function(){
        if(!store.notes[carId]) store.notes[carId] = {};
        store.notes[carId][row.id] = note.value; save();
      });
      add(scoreHost, el('div',{class:'srow'},[
        el('div',{class:'sl'},[ row.label, row.note ? el('span',{class:'sn',text:row.note}) : null ]),
        seg,
        el('details',{class:'notefield'},[ el('summary',{text:'Add a note'}), note ])
      ]));
    });
    var clear = el('button',{class:'btn', type:'button', text:'Clear scores for '+carLabel(carId)});
    clear.addEventListener('click', function(){
      delete store.scores[carId]; delete store.notes[carId]; save(); renderScores(); renderCompare();
    });
    add(scoreHost, el('div',{class:'btnrow', style:'margin-top:1rem'}, clear));
  }
  function carLabel(id){ var f = T.scoreCars.filter(function(c){ return c.id===id; })[0]; return f? f.label : id; }
  T.scoreCars.forEach(function(c){
    var b = el('button',{class:'cartab', type:'button', role:'tab', 'aria-selected': store.car===c.id ? 'true':'false', text:c.label});
    b.addEventListener('click', function(){
      store.car = c.id; save();
      Array.prototype.forEach.call(tabs.children, function(x){ x.setAttribute('aria-selected', x===b?'true':'false'); });
      renderScores();
    });
    add(tabs, b);
  });

  /* ---- compare ---- */
  var compareHost = el('div',{id:'td-compare'});
  function renderCompare(){
    compareHost.textContent = '';
    var scored = T.scoreCars.filter(function(c){ return store.scores[c.id] && Object.keys(store.scores[c.id]).length; });
    if(!scored.length){
      add(compareHost, el('p',{class:'mini',text:'Score at least one car and the side-by-side table appears here.'}));
      return;
    }
    var head = el('tr',[ el('th',{text:'Item'}) ]);
    scored.forEach(function(c){ add(head, el('th',{class:'n',text:c.label}) ); });
    var tb = el('tbody');
    T.scoreRows.forEach(function(row){
      var tr = el('tr',[ el('th',{scope:'row',text:row.label}) ]);
      var vals = scored.map(function(c){ return (store.scores[c.id]||{})[row.id]; });
      var best = Math.max.apply(null, vals.map(function(v){ return v||0; }));
      scored.forEach(function(c, i){
        var v = vals[i];
        add(tr, el('td',{class:'n'}, v==null ? el('span',{class:'mini',text:'—'})
          : (v===best && best>0 ? el('strong',{text:String(v)}) : String(v))));
      });
      add(tb, tr);
    });
    var totRow = el('tr',{class:'hl'},[ el('th',{scope:'row',text:'Total (of '+(T.scoreRows.length*5)+')'}) ]);
    var totals = scored.map(function(c){
      var s = store.scores[c.id]||{};
      return T.scoreRows.reduce(function(a,r){ return a + (s[r.id]||0); }, 0);
    });
    var bestTot = Math.max.apply(null, totals);
    totals.forEach(function(t){ add(totRow, el('td',{class:'n'}, t===bestTot ? el('strong',{text:String(t)}) : String(t))); });
    add(tb, totRow);
    var doneRow = el('tr',[ el('th',{scope:'row',text:'Rows filled in'}) ]);
    scored.forEach(function(c){
      add(doneRow, el('td',{class:'n',text: Object.keys(store.scores[c.id]).length + '/' + T.scoreRows.length}));
    });
    add(tb, doneRow);
    add(compareHost, el('div',{class:'tw'}, el('table',[ el('thead',head), tb ])));
    add(compareHost, el('p',{class:'mini',text:'Bold is the best score in that row. A total only means something once you have filled in the same rows for each car — the last line shows how many you did.'}));

    var notes = [];
    scored.forEach(function(c){
      var n = store.notes[c.id]||{};
      T.scoreRows.forEach(function(r){ if(n[r.id]) notes.push({car:c.label, row:r.label, t:n[r.id]}); });
    });
    if(notes.length){
      add(compareHost, el('details',{class:'tv'},[
        el('summary',{text:'Your notes ('+notes.length+')'}),
        el('div', notes.map(function(n){
          return el('div',{class:'numline'},[ el('span',[ el('strong',{text:n.car+' · '}), n.row ]), el('span',{text:n.t}) ]);
        }))
      ]));
    }
  }

  var exportBtn = el('button',{class:'btn', type:'button', text:'Copy everything as text'});
  exportBtn.addEventListener('click', function(){
    var lines = ['Test drive '+fmtDate(T.date)+' — scores', ''];
    T.scoreCars.forEach(function(c){
      var s = store.scores[c.id]; if(!s || !Object.keys(s).length) return;
      lines.push(c.label);
      T.scoreRows.forEach(function(r){
        if(s[r.id]!=null){
          var n = (store.notes[c.id]||{})[r.id];
          lines.push('  '+r.label+': '+s[r.id]+(n? ' — '+n : ''));
        }
      });
      lines.push('  TOTAL: '+T.scoreRows.reduce(function(a,r){ return a+(s[r.id]||0); },0)+'/'+(T.scoreRows.length*5));
      lines.push('');
    });
    var txt = lines.join('\n');
    function done(msg){ exportBtn.textContent = msg; setTimeout(function(){ exportBtn.textContent='Copy everything as text'; }, 1800); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ done('Copied'); }, function(){ fallback(); });
    } else fallback();
    function fallback(){
      var ta = el('textarea',{style:'position:fixed;left:-9999px'}); ta.value = txt;
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); done('Copied'); }catch(e){ done('Copy failed'); }
      document.body.removeChild(ta);
    }
  });
  var resetAll = el('button',{class:'btn', type:'button', text:'Reset the whole checklist'});
  resetAll.addEventListener('click', function(){
    if(!window.confirm('Clear every tick, score and note?')) return;
    store = {checks:{}, scores:{}, notes:{}, car:T.scoreCars[0].id};
    save();
    document.querySelectorAll('.chk input[type=checkbox]').forEach(function(i){ i.checked = false; });
    renderScores(); renderCompare();
  });

  mount('s-testdrive', [
    el('header',[
      el('p',{class:'eyebrow',text:'7 · Test drive'}),
      el('h2',{text:'Today, in the car park'}),
      el('div',{class:'today'},[
        el('b',{text:'Today is '+fmtDate(T.date)+'.'}),
        el('div',{text:'Everything below ticks and saves on this device. It works offline. Ticks, scores and notes stay put if you close the tab.'})
      ]),
      el('p',{class:'lede',text:'Score every car before you leave its car park. Memory degrades fast when you drive several cars in a row, and the whole point of a same-day comparison is that it is same-day.'})
    ]),
    priority,
    el('div',{class:'btnrow', style:'margin:0 0 1rem;align-items:center'},[ exportBtn, resetAll, saveNote ]),
    groups,
    el('div',{class:'card'},[
      el('h3',{text:'Score each car the same way'}),
      el('p',{class:'mini',text:T.scoreNote}),
      tabs,
      scoreHost
    ]),
    el('div',{class:'card'},[
      el('h3',{text:'All cars, side by side'}),
      compareHost
    ]),
    el('div',{class:'card'},[
      el('h3',{text:T.later.title}),
      el('ol',{class:'reasons'}, T.later.rows.map(function(t){ return el('li',{text:t}); }))
    ])
  ]);

  renderScores(); renderCompare(); updateProgress();
})();

/* ========================================================================
   SECTION 8 — OPEN QUESTIONS AND GAPS
   ====================================================================== */
(function gapsSection(){
  var G = D.openQuestions;

  var pendingCount = 0;
  D.pendingIndex.forEach(function(g){ pendingCount += g.keys.length; });

  var pIdx = el('div');
  D.pendingIndex.forEach(function(g){
    add(pIdx, el('details',{class:'out'},[
      el('summary',[ el('span',{class:'nm',text:g.group}), el('span',{class:'prog',text:String(g.keys.length)}) ]),
      el('div',{class:'inner'}, el('div',{class:'tw'}, el('table',[
        el('thead', el('tr',[ el('th',{text:'Key in data.js'}), el('th',{text:'What is needed'}) ])),
        el('tbody', g.keys.map(function(k){
          return el('tr',[ el('td', el('code',{style:'font-family:var(--mono);font-size:.78rem',text:k.key})),
            el('td',{text:k.need}) ]);
        }))
      ])))
    ]));
  });

  mount('s-gaps', [
    el('header',[
      el('p',{class:'eyebrow',text:'8 · Open questions and gaps'}),
      el('h2',{text:'What this page does not know'}),
      el('p',{class:'lede',text:G.intro})
    ]),
    el('div',{class:'tiles'},[
      el('div',{class:'tile'},[ el('p',{class:'lab',text:'Slots still pending in data.js'}),
        el('p',{class:'val',text:String(pendingCount)}), el('p',{class:'sub',text:'Each one is listed below with its exact key.'}) ]),
      el('div',{class:'tile'},[ el('p',{class:'lab',text:'Figures shown but flagged'}),
        el('p',{class:'val',text:String(G.unverified.rows.length)}), el('p',{class:'sub',text:'Present in the UI, marked unconfirmed.'}) ]),
      el('div',{class:'tile'},[ el('p',{class:'lab',text:'Things that could not be verified at all'}),
        el('p',{class:'val',text:String(G.couldNotVerify.groups.reduce(function(a,g){ return a+g.rows.length; },0))}),
        el('p',{class:'sub',text:'No substitute was invented for any of them.'}) ])
    ]),
    el('div',{class:'card', style:'margin-top:1rem'},[
      el('h3',{text:G.toTheBuyer.title}),
      el('div', G.toTheBuyer.rows.map(function(r){
        return el('div',{class:'callout '+(r.status==='answered'?'good':'caveat')},[
          el('span',{class:'lbl',text:r.status==='answered'?'Answered':'Still open'}),
          el('p',{style:'margin:0 0 .3em',text:r.q}),
          el('p',{class:'mini', style:'margin:0',text:r.note})
        ]);
      }))
    ]),
    el('div',{class:'card'},[
      el('h3',[ G.unverified.title, ' ', chip('unverified') ]),
      el('div',{class:'tw'}, el('table',[
        el('thead', el('tr',[ el('th',{text:'Item'}), el('th',{text:'Why it is flagged'}), el('th',{text:'Source'}) ])),
        el('tbody', G.unverified.rows.map(function(r){
          return el('tr',[ el('th',{scope:'row',text:r.item}), el('td',{text:r.detail}), el('td', cite(r.src)) ]);
        }))
      ]))
    ]),
    el('div',{class:'card'},[
      el('h3',[ G.couldNotVerify.title, ' ', chip('pending','No data found') ]),
      el('p',{class:'mini',text:G.couldNotVerify.note}),
      el('div', G.couldNotVerify.groups.map(function(g){
        return el('div',[ el('h4',{text:g.group}), el('ul',{class:'reasons'}, g.rows.map(function(t){ return el('li',{text:t}); })) ]);
      }))
    ]),
    el('div',{class:'card'},[
      el('h3',{text:G.thinOrContradictory.title}),
      el('ul',{class:'reasons'}, G.thinOrContradictory.rows.map(function(t){ return el('li',{text:t}); }))
    ]),
    el('div',{class:'card'},[
      el('h3',{text:'The pending index — every empty slot, with its key'}),
      el('p',{class:'mini',text:'Fill the value, set status to "verified", add src and date, delete need. Nothing in index.html should have to change.'}),
      pIdx
    ])
  ]);
})();

/* ========================================================================
   SOURCES APPENDIX + FOOTER
   ====================================================================== */
(function sourcesSection(){
  var ids = Object.keys(D.sources).sort(function(a,b){
    return (D.sources[b].date||'').localeCompare(D.sources[a].date||'');
  });
  mount('s-sources', [
    el('header',[
      el('p',{class:'eyebrow',text:'Appendix'}),
      el('h2',{text:'Every source, with its date'}),
      el('p',{class:'lede',text:'Newest first. Where a source carries a methodology warning, that warning is printed here and repeats everywhere the source is used.'})
    ]),
    el('ol',{class:'srclist'}, ids.map(function(i){
      var s = D.sources[i];
      return el('li',[
        el('span',{class:'p',text:s.publisher}), ' · ', s.title, ' · ', fmtDate(s.date),
        s.url ? frag([' · ', el('a',{href:s.url, rel:'noreferrer noopener', target:'_blank', text:s.url})]) : null,
        s.note ? el('div',{class:'callout caveat', style:'margin:.4rem 0 0'},[ el('p',{style:'margin:0',text:s.note}) ]) : null
      ]);
    }))
  ]);

  mount('foot',[
    el('p',[ 'A research report for one car purchase. Bellevue, WA. Compiled ', fmtDate(D.meta.compiled),
      ', last updated ', fmtDate(D.meta.lastTouched), '.' ]),
    el('p',{text:'Every figure on this page comes from data.js. Nothing was filled in from memory. Where the research could not find a number, the page says so.'}),
    el('p',{class:'mini',text:'No network requests. Works offline. Prints on paper.'})
  ]);
})();

})();
</script>
